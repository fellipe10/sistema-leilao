<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main-content})}"
      lang="pt-BR">
<head>
    <title>Gerenciar Lotes — Admin</title>
</head>
<body>
<th:block th:fragment="main-content">
<div class="inner-content">

    <!-- Breadcrumb -->
    <p style="font-size:.85rem; color:var(--gray-400); margin-bottom:1.2rem;">
        <a th:href="@{/admin}" style="color:var(--blue);text-decoration:none;">Dashboard</a>
        &rsaquo; Lotes
    </p>

    <div class="section-header">
        <h1 class="page-title" style="margin-bottom:0;">Gerenciar Lotes</h1>
        <a th:href="@{/admin/items/new}" class="btn btn-primary">+ Novo Lote</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger"  th:if="${erro}"   th:text="${erro}"></div>

    <!-- Filtros -->
    <form th:action="@{/admin/items}" method="get"
          style="background:var(--white);border:1px solid var(--gray-200);border-radius:10px;
                 padding:1.2rem 1.4rem;margin-bottom:1.5rem;display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end;">

        <div style="flex:2;min-width:160px;">
            <label style="font-size:.8rem;font-weight:600;color:var(--gray-500);display:block;margin-bottom:.3rem;">Título</label>
            <input type="text" name="titulo" placeholder="Buscar por título..."
                   th:value="${titulo}"
                   style="padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:7px;
                          font-size:.9rem;width:100%;font-family:inherit;"/>
        </div>

        <div style="flex:1;min-width:130px;">
            <label style="font-size:.8rem;font-weight:600;color:var(--gray-500);display:block;margin-bottom:.3rem;">Status</label>
            <select name="status"
                    style="padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:7px;
                           font-size:.9rem;width:100%;font-family:inherit;background:var(--white);">
                <option value="">Todos</option>
                <option value="ATIVO"     th:selected="${status == 'ATIVO'}">Ativo</option>
                <option value="PENDENTE"  th:selected="${status == 'PENDENTE'}">Pendente</option>
                <option value="ENCERRADO" th:selected="${status == 'ENCERRADO'}">Encerrado</option>
            </select>
        </div>

        <div style="flex:1;min-width:130px;">
            <label style="font-size:.8rem;font-weight:600;color:var(--gray-500);display:block;margin-bottom:.3rem;">Encerramento de</label>
            <input type="date" name="de" th:value="${de}"
                   style="padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:7px;
                          font-size:.9rem;width:100%;font-family:inherit;"/>
        </div>

        <div style="flex:1;min-width:130px;">
            <label style="font-size:.8rem;font-weight:600;color:var(--gray-500);display:block;margin-bottom:.3rem;">até</label>
            <input type="date" name="ate" th:value="${ate}"
                   style="padding:8px 12px;border:1.5px solid var(--gray-200);border-radius:7px;
                          font-size:.9rem;width:100%;font-family:inherit;"/>
        </div>

        <div style="display:flex;gap:.5rem;">
            <button type="submit" class="btn btn-primary btn-sm">Filtrar</button>
            <a th:href="@{/admin/items}" class="btn btn-outline btn-sm">Limpar</a>
        </div>
    </form>

    <div class="tabela-wrap">
        <table>
            <thead>
                <tr>
                    <th>Imagem</th>
                    <th>Título</th>
                    <th>Preço Inicial</th>
                    <th>Preço Atual</th>
                    <th>Início</th>
                    <th>Encerramento</th>
                    <th>Status / Vencedor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="8" class="no-bids">Nenhum lote encontrado.</td>
                </tr>
                <tr th:each="item : ${items}">
                    <td>
                        <img th:if="${item.imageUrl != null}" th:src="${item.imageUrl}"
                             style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-200);"
                             alt="imagem"/>
                        <div th:unless="${item.imageUrl != null}"
                             style="width:52px;height:52px;background:var(--gray-100);border-radius:6px;
                                    display:flex;align-items:center;justify-content:center;
                                    font-size:.7rem;color:var(--gray-400);">—</div>
                    </td>
                    <td style="font-weight:600;" th:text="${item.title}"></td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(item.startingPrice, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td style="color:var(--green);font-weight:600;"
                        th:text="${'R$ ' + #numbers.formatDecimal(item.currentPrice, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${#temporals.format(item.startDate, 'dd/MM/yy HH:mm')}"></td>
                    <td th:text="${#temporals.format(item.endDate,   'dd/MM/yy HH:mm')}"></td>
                    <td>
                        <span th:if="${item.status.name() == 'PENDENTE'}"  class="badge badge-pendente">Pendente</span>
                        <span th:if="${item.status.name() == 'ATIVO'}"     class="badge badge-ativo">Ativo</span>
                        <span th:if="${item.status.name() == 'ENCERRADO'}" class="badge badge-encerrado">Encerrado</span>

                        <!-- Vencedor (destacado, só quando encerrado) -->
                        <div th:if="${item.status.name() == 'ENCERRADO'}"
                             style="margin-top:6px;">
                            <span th:if="${item.winner != null}"
                                  style="display:inline-block;background:var(--green-light);
                                         color:var(--green);border:1px solid #bbf7d0;
                                         border-radius:6px;padding:3px 8px;
                                         font-size:.82rem;font-weight:700;line-height:1.4;">
                                🏆 <span th:text="${item.winner.name}"></span>
                            </span>
                            <span th:if="${item.winner == null}"
                                  style="font-size:.78rem;color:var(--gray-400);">Sem vencedor</span>
                        </div>
                    </td>
                    <td>
                        <div style="display:flex;gap:6px;align-items:center;flex-wrap:nowrap;">
                            <a th:href="@{/items/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline">Ver</a>
                            <a th:href="@{/admin/items/{id}/edit(id=${item.id})}"
                               class="btn btn-sm btn-outline">Editar</a>
                            <form th:action="@{/admin/items/{id}/delete(id=${item.id})}" method="post"
                                  onsubmit="return confirm('Deseja realmente remover este lote?')"
                                  style="margin:0;">
                                <button type="submit" class="btn btn-sm btn-danger">Deletar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</th:block>
</body>
</html>
